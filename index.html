<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brand New Body</title>
<meta name="description" content="Training, fuel and mobility log.">
<meta name="theme-color" content="#141824">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BNB">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;900&family=Chivo:wght@400;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <div class="eyebrow" id="datestamp">&nbsp;</div>
    <h1>Brand<br>New <em id="mastword">Body</em></h1>
    <div class="modeswitch" id="modeswitch" role="tablist" aria-label="Programme"></div>
  </header>
  <!-- No aria-live here: render() replaces this whole subtree on every
       checkbox tick, which made screen readers re-announce the entire page
       each tap. Transient announcements go through #toast (role=status). -->
  <main id="view"></main>
  <div class="foot" id="foot"></div>
</div>

<nav class="tabs" id="tabs" aria-label="Sections">
  <a href="#/today" data-tab="today">Today</a>
  <a href="#/week" data-tab="week">Week</a>
  <a href="#/progress" data-tab="progress">Progress</a>
  <a href="#/setup" data-tab="setup">Setup</a>
</nav>

<div class="toast" id="toast" role="status"></div>
<div class="resttimer" id="resttimer" hidden role="timer">
  <div class="rt-bar"></div>
  <div class="rt-row">
    <span class="rt-time">0:00</span>
    <button id="rtAdd">+30s</button>
    <button id="rtStop">Stop</button>
  </div>
</div>
<div class="updatebar" id="updatebar" hidden role="status">
  <span id="updateMsg">New version available.</span>
  <button id="updateBtn">Reload</button>
  <button id="updateDismiss" aria-label="Dismiss">&#215;</button>
</div>
<script src="sync.js"></script>
<script src="whoop.js"></script>
<script src="app.js"></script>
</body>
</html>
